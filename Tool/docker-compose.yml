services:
  db:
    image: postgres:16-alpine
    container_name: nis2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oscal
      POSTGRES_PASSWORD: oscal_local_dev
      POSTGRES_DB: nis2_audit
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oscal -d nis2_audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: nis2-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://oscal:oscal_local_dev@db:5432/nis2_audit
      EVIDENCE_STORAGE_PATH: /data/evidence
      SEED_DEMO_DATA: "true"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evidence_data:/data/evidence
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: nis2-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  evidence_data:
